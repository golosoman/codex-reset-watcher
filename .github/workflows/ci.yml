name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and vet
        run: make fmt-check vet
      - name: Tests and race detector
        run: make test-race
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          make vuln
      - name: Static binary
        run: make build
      - name: Container build
        run: docker build -t codex-reset-watcher:ci .
