name: codex-reset-watcher
services:
  watcher:
    image: ${WATCHER_IMAGE:-codex-reset-watcher:local}
    build: .
    restart: unless-stopped
    env_file: .env
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8501:8080"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /watcher, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
